<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zakupy"><meta name="theme-color" content="#FFF9F4">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700;800&display=swap" rel="stylesheet">
  
<title>Zakupy</title>
<style>
:root{--bg:#FFF9F4;--card:#fff;--ink:#2E2A47;--mut:#7B7694;--line:#EEE4F3;--pri:#CDB9FF;--fab:#FFB5CC;--vio:#6B4FD8;--peach:#FFB78F;--mint:#B5EAD7;--rose:#FFB5CC;--r:18px;--serif:"Nunito",sans-serif;--sans:"Nunito",sans-serif;}
@media(prefers-color-scheme:dark){:root{--bg:#1E1A2E;--card:#2A2540;--ink:#F4EFFF;--mut:#A69FC4;--line:#3A3458;--vio:#C5B3FF}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--sans)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(90px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 12px 8px}
.row{display:flex;gap:8px;align-items:center}.scroll{display:flex;gap:8px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.ttl{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:-.01em}h3{font-family:var(--serif);font-size:22px;font-weight:700}svg{flex:none;display:block}

button, .chip, .btn, .fab, .gear, .ib, .st {
  transition: transform 0.1s ease, opacity 0.1s ease, box-shadow 0.1s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button:active, .chip:active, .btn:active, .fab:active, .gear:active, .ib:active, .st:active {
  transform: scale(0.93);
  opacity: 0.85;
}

.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--c,var(--line));background:var(--card);color:var(--on,var(--ink));font-family:var(--serif);font-weight:600;font-size:16px;display:flex;align-items:center;gap:7px}
.chip.on{background:var(--c,var(--pri));color:var(--on,#2E2A47)}@media(prefers-color-scheme:dark){.chip:not(.on){color:var(--c,var(--ink))}}
.f{min-height:36px;font-size:14px;padding:0 12px;gap:4px}
h2{margin:20px 12px 8px}.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:var(--c);color:var(--on);font-family:var(--serif);font-weight:700;font-size:15px}
.item{display:flex;gap:12px;align-items:center;margin:0 12px 8px;padding:8px 12px 8px 10px;min-height:62px;background:var(--card);border:1.5px solid var(--line);border-left:7px solid var(--c,var(--line));border-radius:var(--r)}
.st{flex:none;width:46px;height:46px;border-radius:23px;border:3px solid var(--peach);background:var(--card);color:#2E2A47;display:flex;align-items:center;justify-content:center;padding:0}
.st.p{background:var(--mint);border-color:#82D3B3}.st.n{background:var(--rose);border-color:#FF8FB0}
.acts{flex:none;display:flex;gap:4px;align-items:center}.ib{width:40px;height:40px;border-radius:20px;border:0;background:var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}.ib.del{color:#D63A5C}
.qty-ctrls{display:flex;align-items:center;gap:2px;background:var(--line);border-radius:12px;padding:2px;margin-right:4px}
.qty-btn{width:28px;height:28px;border-radius:10px;border:0;background:var(--card);color:var(--ink);font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer}
.t{flex:1;min-width:0}.t b{display:block;font-weight:700}.t small{color:var(--mut);display:block}.p .t b{text-decoration:line-through;color:var(--mut)}
.nu{font-size:13px;font-weight:600;color:var(--vio)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:31px;border:0;background:var(--fab);color:#2E2A47;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(255,181,204,.45)}
.gear{margin-left:auto;background:var(--card);border:2px solid var(--line);border-radius:22px;min-width:44px;min-height:44px;color:var(--ink);display:flex;align-items:center;justify-content:center}
.sheet{position:fixed;inset:0;background:rgba(46,42,71,.45);z-index:9;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:18px 14px calc(16px + env(safe-area-inset-bottom))}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;min-height:46px;font-family:inherit;font-size:16px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}input[type=color]{padding:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{min-height:50px;border-radius:16px;border:0;background:var(--pri);color:#2E2A47;font-family:inherit;font-weight:800;font-size:16px;padding:0 16px;width:100%;margin-top:12px}
.btn.s{background:var(--card);color:var(--ink);border:2px solid var(--line)}.btn.d{background:#FF9AA8}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.empty{text-align:center;color:var(--mut);padding:50px 20px}.err{color:#D63A5C;font-size:14px;font-weight:600}
</style></head><body><header><div class="row"><b class="ttl">Zakupy</b><button class="gear" id="cfg" aria-label="Ustawienia">⚙</button></div>
<div class="scroll" id="tabs"></div><div class="scroll" id="filt"></div>
<div class="row" style="margin-top:6px"><input id="q" type="search" placeholder="Szukaj na liście…" style="flex:1"><select id="sortMode" aria-label="Sortowanie" style="width:auto;min-height:42px;font-size:14px;padding:4px 8px"><option value="alpha">Alfabetycznie</option><option value="added">Kolejność dodania</option></select></div></header>
<main id="main"></main><button class="fab" id="add" aria-label="Dodaj produkt">+</button><div id="modal"></div>
<script src="nutrition.js"></script><script src="foods.js"></script><script src="app.js"></script></body></html>
