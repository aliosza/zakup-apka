<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zakupy"><meta name="theme-color" content="#FFF9F4">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700;800&display=swap" rel="stylesheet">
  
<title>Zakupy & Dziennik</title>
<style>
:root{--bg:#FFF9F4;--card:#fff;--ink:#2E2A47;--mut:#7B7694;--line:#EEE4F3;--pri:#CDB9FF;--fab:#FFB5CC;--fab-ink:#2E2A47;--vio:#6B4FD8;--peach:#FFB78F;--mint:#B5EAD7;--rose:#FFB5CC;--r:18px;--font:"Nunito",sans-serif;}
@media(prefers-color-scheme:dark){:root{--bg:#151221;--card:#221E33;--ink:#F4EFFF;--mut:#9E96BE;--line:#312B4A;--vio:#C5B3FF;--fab:#E08DAC;--fab-ink:#151221}}
*{box-sizing:border-box}button{font-family:inherit}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(90px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 12px 8px}
.row{display:flex;gap:8px;align-items:center}.scroll{display:flex;gap:8px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.ttl{font-size:26px;font-weight:700;letter-spacing:-.01em}h3{font-size:22px;font-weight:700}svg{flex:none;display:block}

button, .chip, .btn, .fab, .gear, .ib, .st {
  transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s ease, background-color 0.15s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}
button:active, .chip:active, .btn:active, .fab:active, .gear:active, .ib:active, .st:active {
  transform: scale(0.92) translateY(1px);
  opacity: 0.8;
}

.mode-switcher{display:flex;background:var(--line);border-radius:18px;padding:3px;gap:2px}
.mode-btn{border:0;background:transparent;color:var(--mut);font-weight:700;font-size:13px;padding:6px 12px;border-radius:14px;display:flex;align-items:center;gap:6px}
.mode-btn.active{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}

.chip{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:2px solid var(--c,var(--line));background:var(--card);color:var(--on,var(--ink));font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--c,var(--pri));color:var(--on,#2E2A47)}@media(prefers-color-scheme:dark){.chip:not(.on){color:var(--c,var(--ink))}}
.f{min-height:34px;font-size:13px;padding:0 10px;gap:4px}
h2{margin:20px 12px 8px}.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:var(--c);color:var(--on);font-weight:700;font-size:15px}

.item-wrapper{margin:0 12px 8px;overflow:hidden;border-radius:var(--r)}
.item{display:flex;gap:12px;align-items:center;padding:8px 12px 8px 10px;min-height:62px;background:var(--card);border:1.5px solid var(--line);border-left:7px solid var(--c,var(--line));border-radius:var(--r);transition:transform 0.2s ease, background-color 0.2s ease;touch-action:pan-y}
.item.swiping{transition:none}

.st{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.st:not(.p):not(.n){border-color:var(--c, var(--line));background:rgba(255,255,255,.8)}
@media(prefers-color-scheme:dark){.st:not(.p):not(.n){background:rgba(34,30,51,.8)}}
.st.p{background:var(--mint);border-color:#82D3B3;color:#1B5038}
.st.n{background:var(--rose);border-color:#FF8FB0;color:#701A31}

.st svg path {
  stroke-dasharray: 30;
  stroke-dashoffset: 30;
  animation: drawIcon 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
@keyframes drawIcon { to { stroke-dashoffset: 0; } }

.acts{flex:none;display:flex;gap:4px;align-items:center}.ib{width:40px;height:40px;border-radius:20px;border:0;background:var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}.ib.del{color:#D63A5C}
.t{flex:1;min-width:0}.t b{display:block;font-weight:700}.t small{color:var(--mut);display:block}.p .t b{text-decoration:line-through;color:var(--mut)}
.nu{font-size:13px;font-weight:700;color:var(--vio)}

.tracker-summary{margin:12px;padding:16px;background:var(--card);border:1.5px solid var(--line);border-radius:22px}
.tracker-summary .main-k{font-size:28px;font-weight:800;color:var(--vio)}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;text-align:center}
.macro-item{background:var(--bg);padding:8px 4px;border-radius:14px;font-size:12px;font-weight:700}
.macro-item span{display:block;color:var(--mut);font-size:10px;font-weight:600}

.fab{position:fixed;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:31px;border:0;background:var(--fab);color:var(--fab-ink);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:8}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(100px);background:var(--card);color:var(--ink);border:2px solid var(--line);padding:10px 18px;border-radius:999px;box-shadow:0 10px 25px rgba(0,0,0,.15);display:flex;align-items:center;gap:12px;z-index:20;font-weight:600;opacity:0;visibility:hidden;transition:transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, visibility 0.3s ease;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;pointer-events:auto}
.toast button{background:var(--pri);border:0;padding:6px 14px;border-radius:999px;font-weight:800;color:#2E2A47;cursor:pointer}

.gear, .filter-btn{background:var(--card);border:2px solid var(--line);border-radius:22px;min-width:44px;min-height:44px;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0 14px;gap:6px;font-family:inherit;font-weight:700;font-size:15px}
.gear{margin-left:auto}

.sheet{position:fixed;inset:0;background:rgba(21,18,33,.6);z-index:30;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:18px 14px calc(16px + env(safe-area-inset-bottom))}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;min-height:46px;font-family:inherit;font-size:16px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}input[type=color]{padding:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{min-height:50px;border-radius:16px;border:0;background:var(--pri);color:#2E2A47;font-family:inherit;font-weight:800;font-size:16px;padding:0 16px;width:100%;margin-top:12px}
.btn.s{background:var(--card);color:var(--ink);border:2px solid var(--line)}.btn.d{background:#FF9AA8}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.empty{text-align:center;color:var(--mut);padding:50px 20px}.err{color:#D63A5C;font-size:14px;font-weight:600}
</style></head><body><header><div class="row">
  <div class="mode-switcher" id="modeSwitcher">
    <button class="mode-btn active" data-mode="shopping" id="btnShopMode"></button>
    <button class="mode-btn" data-mode="tracker" id="btnTrackMode"></button>
  </div>
  <button class="gear" id="cfg" aria-label="Ustawienia">⚙</button>
</div>
<div class="row" style="margin-top:8px" id="subHeader"></div></header>
<main id="main"></main><button class="fab" id="add" aria-label="Dodaj pozycję">+</button><div id="modal"></div>
<div class="toast" id="toast" style="display:none;"><span>Usunięto pozycję</span><button id="undoBtn">Cofnij</button></div>
<script src="nutrition.js"></script><script src="foods.js"></script><script src="app.js"></script></body></html>
